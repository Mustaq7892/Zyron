<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="24" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- icon mark -->
  <rect x="60" y="60" width="180" height="180" rx="40" fill="#132038" stroke="#3b82f6" stroke-width="3"/>
  <path d="M109 120 L191 120 L109 180 L191 180" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="109" cy="120" r="8" fill="#60a5fa"/>
  <circle cx="109" cy="120" r="3" fill="#132038"/>
  <circle cx="191" cy="120" r="8" fill="#60a5fa"/>
  <circle cx="191" cy="120" r="3" fill="#132038"/>
  <circle cx="109" cy="180" r="8" fill="#60a5fa"/>
  <circle cx="109" cy="180" r="3" fill="#132038"/>
  <circle cx="191" cy="180" r="8" fill="#60a5fa"/>
  <circle cx="191" cy="180" r="3" fill="#132038"/>
  <circle cx="150" cy="150" r="6" fill="#93c5fd"/>

  <!-- wordmark -->
  <text x="290" y="140" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="4">ZYRON</text>
  <text x="292" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#8ea6d6" letter-spacing="6">PERSONAL AI ASSISTANT</text>
  <line x1="292" y1="196" x2="1140" y2="196" stroke="#2a3a5c" stroke-width="1"/>

  <!-- description -->
  <text x="292" y="228" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#c8d3ea">Zyron understands requests, plans with a local AI model,</text>
  <text x="292" y="254" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#c8d3ea">validates every argument, and asks before it guesses.</text>

  <!-- pipeline pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
    <rect x="292" y="290" width="160" height="56" rx="28" fill="#132038" stroke="#3b82f6" stroke-width="2"/>
    <text x="372" y="324" text-anchor="middle" fill="#e2e8f0">Understand</text>

    <text x="477" y="325" text-anchor="middle" fill="#64748b" font-size="22">→</text>

    <rect x="502" y="290" width="160" height="56" rx="28" fill="#1e1638" stroke="#8b5cf6" stroke-width="2"/>
    <text x="582" y="324" text-anchor="middle" fill="#e2e8f0">Plan</text>

    <text x="687" y="325" text-anchor="middle" fill="#64748b" font-size="22">→</text>

    <rect x="712" y="290" width="160" height="56" rx="28" fill="#0f2a1c" stroke="#22c55e" stroke-width="2"/>
    <text x="792" y="324" text-anchor="middle" fill="#e2e8f0">Validate</text>

    <text x="897" y="325" text-anchor="middle" fill="#64748b" font-size="22">→</text>

    <rect x="922" y="290" width="160" height="56" rx="28" fill="#2a1f0a" stroke="#f59e0b" stroke-width="2"/>
    <text x="1002" y="324" text-anchor="middle" fill="#e2e8f0">Execute</text>
  </g>

  <!-- badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
    <rect x="292" y="400" width="180" height="40" rx="8" fill="#132038" stroke="#2a3a5c" stroke-width="1"/>
    <text x="382" y="425" text-anchor="middle">Python 3.13+</text>

    <rect x="492" y="400" width="230" height="40" rx="8" fill="#132038" stroke="#2a3a5c" stroke-width="1"/>
    <text x="607" y="425" text-anchor="middle">27/27 Tests Passing</text>

    <rect x="742" y="400" width="160" height="40" rx="8" fill="#132038" stroke="#2a3a5c" stroke-width="1"/>
    <text x="822" y="425" text-anchor="middle">MIT License</text>
  </g>

  <!-- feature grid -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- row 1 -->
    <circle cx="210" cy="500" r="26" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-width="2"/>
    <text x="210" y="507" font-size="16" font-weight="700" fill="#60a5fa">AI</text>
    <text x="210" y="548" font-size="15" font-weight="500" fill="#cbd5e1">AI Planning</text>

    <circle cx="470" cy="500" r="26" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="2"/>
    <text x="470" y="507" font-size="16" font-weight="700" fill="#a78bfa">RT</text>
    <text x="470" y="548" font-size="15" font-weight="500" fill="#cbd5e1">Smart Routing</text>

    <circle cx="730" cy="500" r="26" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="2"/>
    <text x="730" y="507" font-size="16" font-weight="700" fill="#34d399">CR</text>
    <text x="730" y="548" font-size="15" font-weight="500" fill="#cbd5e1">Capability Registry</text>

    <circle cx="990" cy="500" r="26" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2"/>
    <text x="990" y="507" font-size="16" font-weight="700" fill="#fbbf24">AS</text>
    <text x="990" y="548" font-size="15" font-weight="500" fill="#cbd5e1">Argument Safety</text>

    <!-- row 2 -->
    <circle cx="210" cy="610" r="26" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-width="2"/>
    <text x="210" y="617" font-size="16" font-weight="700" fill="#f472b6">CL</text>
    <text x="210" y="658" font-size="15" font-weight="500" fill="#cbd5e1">Clarification</text>

    <circle cx="470" cy="610" r="26" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
    <text x="470" y="617" font-size="16" font-weight="700" fill="#38bdf8">ME</text>
    <text x="470" y="658" font-size="15" font-weight="500" fill="#cbd5e1">Persistent Memory</text>

    <circle cx="730" cy="610" r="26" fill="#fb7185" fill-opacity="0.15" stroke="#fb7185" stroke-width="2"/>
    <text x="730" y="617" font-size="16" font-weight="700" fill="#fb7185">VO</text>
    <text x="730" y="658" font-size="15" font-weight="500" fill="#cbd5e1">Voice Interaction</text>

    <circle cx="990" cy="610" r="26" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="2"/>
    <text x="990" y="617" font-size="16" font-weight="700" fill="#4ade80">TS</text>
    <text x="990" y="658" font-size="15" font-weight="500" fill="#cbd5e1">Automated Testing</text>
  </g>

  <!-- quote bar -->
  <rect x="80" y="680" width="1040" height="56" rx="28" fill="#132038" stroke="#2a3a5c" stroke-width="1"/>
  <text x="600" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Built to assist, designed to be safe.</text>
</svg>
